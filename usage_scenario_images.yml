---
name: OpenCloud Image Management
author: Didi Hoffmann <didi@green-coding.io>
description: "
- Create a new space incl. description
- Upload 10 images
- Preview (preview service) of the images
- Implicit: Search Indexing with Tika
- Delete all files - Empty the recycle bin"
ignore-unsupported-compose: true

compose-file: !include docker-compose.yml

services:
  gcb-playwright:
    # Official Playwright Python image. Firefox is already in /ms-playwright, only the Python package is missing.
    # Keep the pip version below equal to the image tag, otherwise playwright looks for other browser builds.
    image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
       DISPLAY: ":0"
    networks:
      opencloud-net:
    setup-commands: # moving repo so we can create files there (is read only)
      - command: cp -r /tmp/repo /tmp/repo-copy
      - command: cd /tmp/repo-copy/downloads && bash make-equivalent-bash.sh
        shell: bash
      - command: pip install --root-user-action=ignore playwright==1.63.0

  opencloud:
    setup-commands:
      - command: sleep 10
  traefik:
    setup-commands:
      - command: sleep 10

flow:
  - name: Images
    container: gcb-playwright
    commands:
      - type: console
        command: python3 /tmp/repo/playwright/images.py
        log-stdout: true
        read-notes-stdout: true
