---
name: "OpenCloud Document Editing (Collaborative)"
author: Didi Hoffmann <didi@green-coding.io>
description: "
- Create a new user (User #2)
- Create an .odt document
- Sharing the document with user #2
- Entering 10 paragraphs of text by user #1
- Opening the link by user #2
- Validate whether expected text is included
- Enter another 2 paragraphs of text
- Validation by user #1 whether expected text is included"
ignore-unsupported-compose: true

compose-file: !include docker-compose.yml

services:
  gcb-playwright:
    image: greencoding/gcb_playwright:v19@sha256:678efc99ccf761e55a59d4833adac8f92d863c7b2b33e434a97135b39950d188
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
       DISPLAY: ":0"
    networks:
      opencloud-net:
    setup-commands: # moving repo so we can create files there (is read only)
      - command: cp -r /tmp/repo /tmp/repo-copy
      - command: cd /tmp/repo-copy/downloads && bash make-equivalent-bash.sh
        shell: bash

  opencloud:
    setup-commands:
      - command: sleep 10
  traefik:
    setup-commands:
      - command: sleep 10

flow:
  - name: Document
    container: gcb-playwright
    commands:
      - type: console
        command: python3 /tmp/repo/playwright/document.py
        log-stdout: true
        read-notes-stdout: true
